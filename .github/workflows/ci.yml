name: CI

# Until this existed, nothing in the repo ran on a pull request: `gh pr checks`
# reported "no checks reported" and the PR page showed no red, which is
# indistinguishable from success on the UI reviewers actually read. A
# release-blocking hang in the browser suite (#62) reached main that way.
# See #63.

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # Suite-wide secret-scan gate, one normative source (kontourai/.github).
  secret-scan:
    name: Secret Scan
    uses: kontourai/.github/.github/workflows/secret-scan.yml@main
    permissions:
      contents: read

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Install browser verification runtime
        run: npx playwright install --with-deps chromium
      - name: Verify
        env:
          # Visual baselines are captured on darwin and are not portable to the
          # linux runner. The same switch the publish gate uses.
          FIELDWORK_VISUAL_SNAPSHOTS: '0'
        run: npm run verify:static
